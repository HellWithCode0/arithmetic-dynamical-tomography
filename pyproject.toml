[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arithmetic-dynamical-tomography-reproducibility"
version = "1.0.0"
description = "Reproducible computations for Arithmetic Dynamical Tomography"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
adt-reproduce = "adt.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
